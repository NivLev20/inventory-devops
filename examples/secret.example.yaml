# EXAMPLE ONLY - placeholder values. Do NOT put real passwords in this file.
# Kept outside k8s/ on purpose, so "kubectl apply -f k8s/" never applies it.
# The real Secret is created by scripts/create-secret.sh and never stored in Git.
# Note: Kubernetes Secrets are base64-encoded, not encrypted.
apiVersion: v1
kind: Secret
metadata:
  name: inventory-secrets
  namespace: inventory
type: Opaque
stringData:
  POSTGRES_PASSWORD: "change-me"
  DATABASE_URL: "postgresql://inventory:change-me@postgres:5432/inventory"
