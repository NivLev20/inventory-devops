# On-demand load generator for the autoscaling (HPA) demo. NOT part of the normal deployment,
# which is why it lives in tools/ and not in k8s/.
#   Start:  kubectl apply -f tools/load-generator.yaml
#   Watch:  kubectl get hpa backend -n inventory -w
#   Stop:   kubectl delete -f tools/load-generator.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load-generator
  namespace: inventory
  labels:
    app: load-generator
spec:
  replicas: 3
  selector:
    matchLabels:
      app: load-generator
  template:
    metadata:
      labels:
        app: load-generator
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534          # "nobody"
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: load
          image: busybox:1.36
          # Calls the heaviest endpoint (analytics) in a tight loop
          command: ["sh", "-c", "while true; do wget -q -O /dev/null http://backend:5000/api/products/analytics; done"]
          resources:
            requests: { cpu: 50m, memory: 16Mi }
            limits: { cpu: 200m, memory: 32Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
