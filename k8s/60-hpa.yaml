# HorizontalPodAutoscaler: adds backend replicas under load, removes them when load drops.
# Uses CPU usage from metrics-server (minikube addons enable metrics-server).
# Target: average 70% of the CPU *request* (100m) -> scale between 2 and 5 pods.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
  namespace: inventory
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60   # wait 1 minute of low load before removing pods (default is 5)
