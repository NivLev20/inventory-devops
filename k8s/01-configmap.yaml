# Non-secret settings. Credentials are in the "inventory-secrets" Secret (scripts/create-secret.sh).
apiVersion: v1
kind: ConfigMap
metadata:
  name: inventory-config
  namespace: inventory
data:
  APP_ENV: "minikube"
  SEED_DATA: "true"                      # load demo products when the database is empty
  # Full service name: the frontend nginx resolves it per request, without DNS search domains
  BACKEND_URL: "http://backend.inventory.svc.cluster.local:5000"
  POSTGRES_DB: "inventory"
  POSTGRES_USER: "inventory"
