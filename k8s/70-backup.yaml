# Nightly database backup (Disaster Recovery).
# - Runs pg_dump every night at 02:00 into its own persistent volume.
# - Keeps the 7 newest backups and deletes older ones.
# Run a backup right now:
#   kubectl create job backup-now --from=cronjob/postgres-backup -n inventory
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-backups
  namespace: inventory
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: inventory
  labels:
    app: postgres-backup
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            app: postgres-backup
        spec:
          restartPolicy: Never
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: postgres:16-alpine
              command:
                - sh
                - -c
                - |
                  set -eo pipefail
                  # After a reboot this job can start before the database (or cluster DNS) is up: wait up to 2 minutes
                  for i in $(seq 1 24); do pg_isready -q -h postgres && break; sleep 5; done
                  FILE="/backups/inventory-$(date +%Y%m%d-%H%M%S).sql.gz"
                  # Write to a temp name and verify it, so a failed dump never counts as a backup
                  pg_dump -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB" | gzip > "$FILE.tmp"
                  gunzip -t "$FILE.tmp"
                  mv "$FILE.tmp" "$FILE"
                  echo "Backup written: $FILE ($(du -h "$FILE" | cut -f1))"
                  # Retention runs only after a verified backup exists: keep the 7 newest
                  ls -1t /backups/inventory-*.sql.gz | tail -n +8 | xargs -r rm -f
                  echo "Backups kept:"; ls -lh /backups
              env:
                - name: POSTGRES_DB
                  valueFrom:
                    configMapKeyRef: { name: inventory-config, key: POSTGRES_DB }
                - name: POSTGRES_USER
                  valueFrom:
                    configMapKeyRef: { name: inventory-config, key: POSTGRES_USER }
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef: { name: inventory-secrets, key: POSTGRES_PASSWORD }
              volumeMounts:
                - name: backups
                  mountPath: /backups
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 300m, memory: 256Mi }
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: postgres-backups
