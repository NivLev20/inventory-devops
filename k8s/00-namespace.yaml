# Pod Security Admission: "baseline" is enforced; "restricted" violations only warn,
# because the official postgres image needs root briefly to prepare its data directory.
apiVersion: v1
kind: Namespace
metadata:
  name: inventory
  labels:
    app.kubernetes.io/part-of: smart-retail-inventory
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
